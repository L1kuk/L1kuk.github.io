<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b2027">
  <meta name="darkreader-lock">
  <meta name="robots" content="noindex, nofollow">
  <title>Dongsheng Li — Personal Homepage</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #11161c;
      --text: #e5e7eb;
      --muted: #b2bac4;
      --line: #3a424c;
      --accent: #9dc9ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 10vh 24px 64px;
      color: var(--text);
      background: var(--background);
      background-image: linear-gradient(to bottom, #282e36 0%, #1b2027 50%, #11161c 100%);
      font: 17px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 48px 50px;
      background: linear-gradient(to bottom, #23282e, #1e2227);
      border: 1px solid #3a424c;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgb(0 0 0 / 18%);
    }
    header { padding-top: 0; }
    .label { margin: 0 0 20px; color: var(--muted); font-size: .75rem; letter-spacing: .16em; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 7vw, 3.2rem); line-height: 1.2; letter-spacing: -.035em; }
    .affiliation { margin: 0; color: var(--muted); font-size: 1.1rem; }
    section { margin-top: 38px; border-top: 1px solid var(--line); padding-top: 26px; }
    h2 { margin: 0 0 22px; font-size: 1.05rem; font-weight: 600; }
    dl { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px 18px; margin: 0; }
    dt { color: var(--muted); font-size: .9rem; }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: var(--accent); text-decoration-color: #53697b; text-underline-offset: 5px; }
    a:hover { text-decoration-color: currentColor; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    @media (max-width: 480px) {
      body { padding: 48px 18px; }
      main { padding: 32px 24px; }
      dl { grid-template-columns: 1fr; gap: 4px; }
      dd + dt { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">PERSONAL HOMEPAGE</p>
      <h1>Dongsheng Li</h1>
      <p class="affiliation">Shanghai Jiao Tong University</p>
    </header>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact &amp; links</h2>
      <dl>
        <dt>Email</dt>
        <dd><a href="mailto:singularity_x@sjtu.edu.cn">singularity_x@sjtu.edu.cn</a></dd>
        <dt>GitHub</dt>
        <dd><a href="https://github.com/L1kuk">github.com/L1kuk</a></dd>
      </dl>
    </section>
  </main>
</body>
</html>
